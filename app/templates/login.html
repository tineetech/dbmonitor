<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>Login · DB Monitor &amp; Backup Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cellipse cx='12' cy='6' rx='8' ry='3'/%3E%3Cpath d='M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6'/%3E%3Cpath d='M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-navy-900 text-slate-200 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-accent/15 border border-white/10">
        <svg class="h-8 w-8 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M3 5v14a9 3 0 0 0 18 0V5"></path>
          <path d="M3 12a9 3 0 0 0 18 0"></path>
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-semibold text-white tracking-tight">DB Monitor</h1>
      <p class="text-xs uppercase tracking-widest text-slate-500">Backup Manager · Admin Console</p>
    </div>

    <form id="login-form" class="rounded-2xl border border-white/10 bg-navy-800/60 backdrop-blur p-6 sm:p-8 shadow-2xl space-y-5">
      <div>
        <label for="username" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               class="w-full rounded-lg border border-white/10 bg-navy-900/60 px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 outline-none focus:border-accent focus:ring-2 focus:ring-accent/30"
               placeholder="admin" />
      </div>
      <div>
        <label for="password" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-white/10 bg-navy-900/60 px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 outline-none focus:border-accent focus:ring-2 focus:ring-accent/30"
               placeholder="••••••••" />
      </div>
      <p id="login-error" class="hidden rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-2.5 text-sm text-red-300"></p>
      <button id="login-submit" type="submit"
              class="w-full rounded-lg bg-accent px-4 py-3 text-sm font-semibold text-white hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-accent/50">
        Sign in
      </button>
      <p class="text-center text-[11px] text-slate-500">Restricted access. All activity is logged in the audit trail.</p>
    </form>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
